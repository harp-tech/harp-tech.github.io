<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="An Event message from the device: the AnalogInput register reports a reading with a timestamp, streamed at 1 kHz without any command from the controller" style="max-width:100%;height:auto;font-size:12px">
<style>svg { color: #212529; font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif; } @media (prefers-color-scheme: dark) { svg { color: #dee2e6; } }</style>
<rect x="40" y="20" width="280" height="152" rx="10" fill="none" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="180" y="92.0" text-anchor="middle" font-size="12" opacity="0.6" fill="currentColor">no command</text>
<text x="180" y="110.0" text-anchor="middle" font-size="11" opacity="0.6" fill="currentColor">the controller sends nothing</text>
<rect x="440" y="20" width="280" height="152" rx="10" fill="#f0883e" fill-opacity="0.1" stroke="#f0883e" stroke-width="1.6"/>
<path d="M440,50 V30 Q440,20 450,20 H710 Q720,20 720,30 V50 Z" fill="#f0883e"/>
<text x="580.0" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Event</text>
<text x="456" y="69" font-size="12" opacity="0.7" fill="currentColor">Register</text>
<text x="704" y="69" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">AnalogInput</text>
<line x1="452" y1="78" x2="708" y2="78" stroke="currentColor" stroke-opacity="0.15"/>
<text x="456" y="97" font-size="12" opacity="0.7" fill="currentColor">Address</text>
<text x="704" y="97" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">35</text>
<line x1="452" y1="106" x2="708" y2="106" stroke="currentColor" stroke-opacity="0.15"/>
<text x="456" y="125" font-size="12" opacity="0.7" fill="currentColor">Payload</text>
<text x="704" y="125" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">Reading = 2.47 V</text>
<line x1="452" y1="134" x2="708" y2="134" stroke="currentColor" stroke-opacity="0.15"/>
<text x="456" y="153" font-size="12" opacity="0.7" fill="currentColor">Timestamp</text>
<text x="704" y="153" text-anchor="end" font-size="12" font-weight="700" fill="currentColor">132.4 s</text>
<text x="580" y="190" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">from the device, at 1 kHz</text>
<polygon points="414,69 358,69 358,63 340,76 358,89 358,83 414,83" fill="currentColor" fill-opacity="0.35"/>
<text x="377" y="57" text-anchor="middle" font-size="11" opacity="0.7" fill="currentColor">sent by</text>
</svg>