<text x="421.4" y="352" text-anchor="middle" font-size="11" font-weight="700" fill="#2fb16d">128.3 s</text>
<text x="150" y="400" font-size="11" opacity="0.7" fill="currentColor">one event, the same timestamp on every device</text>
