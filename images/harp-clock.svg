<circle cx="440" cy="70" r="8" fill="#f0883e"/>
<text x="440" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#f0883e">17.3 s</text>
<circle cx="300" cy="104" r="8" fill="#f0883e"/>
<text x="300" y="90" text-anchor="middle" font-size="11" font-weight="700" fill="#f0883e">902.0 s</text>
<circle cx="600" cy="138" r="8" fill="#f0883e"/>
<text x="600" y="124" text-anchor="middle" font-size="11" font-weight="700" fill="#f0883e">3.6 s</text>
<text x="150" y="172" font-size="11" opacity="0.7" fill="currentColor">one event, three different timestamps</text>
<line x1="20" y1="196" x2="740" y2="196" stroke="currentColor" stroke-opacity="0.2" stroke-dasharray="3 4"/>
<text x="20" y="226" font-size="13" font-weight="700" fill="currentColor">With the Harp synchronization clock</text>
