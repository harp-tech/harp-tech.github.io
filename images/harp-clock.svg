<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-label="Timelines for three devices: without a shared clock the same event gets three different timestamps; with the Harp synchronization clock it gets the same timestamp on every device" style="max-width:100%;height:auto;font-size:12px">
<style>svg { color: #212529; font-family: system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif; } @media (prefers-color-scheme: dark) { svg { color: #dee2e6; } }</style>
<text x="20" y="32" font-size="13" font-weight="700" fill="currentColor">Without a shared clock</text>
<text x="20" y="74" font-weight="700" fill="currentColor">Device A</text>
<line x1="150" y1="70" x2="740" y2="70" stroke="currentColor" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="108" font-weight="700" fill="currentColor">Device B</text>
<line x1="150" y1="104" x2="740" y2="104" stroke="currentColor" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
<text x="20" y="142" font-weight="700" fill="currentColor">Device C</text>
