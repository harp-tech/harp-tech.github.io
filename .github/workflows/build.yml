
name: "Publish the documentation website"

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Generate the device schema tables
        shell: pwsh
        run: ./build.ps1

      - name: Set up .NET tools
        run: dotnet tool restore

      - name: Build documentation
        id: build-documentation
        run: dotnet docfx docfx.json

      - name: Collect documentation website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publish-documentation:
    needs: build-documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      # Pages refuses a deployment while another is in progress
      group: publish-documentation
      cancel-in-progress: false
    permissions:
      # Both required by actions/deploy-pages
      pages: write
      id-token: write
    environment:
      name: documentation-website
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: publish
        uses: actions/deploy-pages@v5
